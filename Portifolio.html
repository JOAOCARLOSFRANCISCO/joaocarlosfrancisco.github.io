<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>João Carlos Francisco | Engenheiro de Software</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- React & ReactDOM & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons (Versão Development para Browser) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body { font-family: 'Poppins', sans-serif; }
        h1, h2, h3, h4, .font-montserrat { font-family: 'Montserrat', sans-serif; }
        .font-poppins { font-family: 'Poppins', sans-serif; }
        
        @media print {
          .no-print { display: none !important; }
          .page-break { page-break-inside: avoid; }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 selection:bg-[#0A3D91] selection:text-white">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Componente de Ícones (Simples wrapper para SVG)
        const Icon = ({ name, size = 24, className = "" }) => {
            useEffect(() => {
                lucide.createIcons();
            }, [name]);
            
            return <i data-lucide={name} width={size} height={size} className={className}></i>;
        };

        const Portfolio = () => {
            const [lang, setLang] = useState('pt');
            const [isVisible, setIsVisible] = useState(false);

            useEffect(() => {
                setIsVisible(true);
                // Re-render icons after mount
                setTimeout(() => lucide.createIcons(), 100);
            }, [lang]); // Re-run when language changes to ensure icons stay

            const content = {
                pt: {
                nav: { about: "Sobre", skills: "Expertise", projects: "Projetos", contact: "Contacto" },
                hero: {
                    role: "Engenheiro de Software & Desenvolvedor Full Stack",
                    slogan: "Inovação, disciplina e código: o futuro começa aqui.",
                    cta: "Ver Projetos",
                    contact: "Entrar em contacto"
                },
                about: {
                    title: "Perfil Profissional",
                    text: "Engenheiro Informático em formação com uma visão global e estratégica. Sou um programador disciplinado e orientado a resultados, focado em criar soluções tecnológicas inovadoras para Angola e para o mercado internacional. Combinando rigor académico com aplicação prática, possuo a maturidade técnica para transformar desafios complexos em sistemas eficientes, escaláveis e seguros.",
                    philosophyTitle: "Filosofia de Trabalho",
                    philosophy: [
                    { title: "Excelência & Ética", desc: "Entrega de código limpo, auditável e de alto padrão." },
                    { title: "Visão Global", desc: "Soluções locais com arquitetura preparada para o mundo." },
                    { title: "Disciplina", desc: "Consistência no desenvolvimento e cumprimento rigoroso de prazos." },
                    { title: "Inovação", desc: "Uso de tecnologias emergentes (VR/XR/AI) para resolver problemas reais." }
                    ]
                },
                skills: {
                    title: "Arsenal Técnico",
                    languages: "Linguagens",
                    frameworks: "Frameworks & Tecnologias",
                    core: "Competências Centrais",
                    list: {
                    lang: ["Java", "C++", "Python", "JavaScript (ES6+)", "HTML5 / CSS3", "C#"],
                    tech: ["Unity VR / XR", "React & Native", "Cordova (Híbrido)", "APIs RESTful", "Git/GitHub", "SQL & NoSQL"],
                    soft: ["Algoritmos Avançados", "Arquitetura de Software", "Otimização de Performance", "Segurança de Dados", "UI/UX Design"]
                    }
                },
                projects: {
                    title: "Projetos Executivos",
                    items: [
                    {
                        title: "Plataforma Internacional de Intercâmbio",
                        category: "Full Stack & AI",
                        desc: "Aplicação social global conectando jovens de múltiplos países. Inclui gamificação, bolsas de estudo e moderação via IA. Arquitetura escalável focada em networking internacional.",
                        tech: ["Java", "React", "AI Integration"]
                    },
                    {
                        title: "Sistema de Turismo e Arrendamento",
                        category: "App Híbrida & Segurança",
                        desc: "Solução completa para alojamento e turismo com sistema antifraude integrado. Painel administrativo premium, mapas inteligentes e gateway de pagamentos seguro.",
                        tech: ["Cordova", "Maps API", "Security Protocols"]
                    },
                    {
                        title: "Simulações Imersivas VR/XR",
                        category: "Realidade Mista",
                        desc: "Experiências imersivas para treinamento corporativo e educação. Foco em realismo físico, assets otimizados e suporte a multiplayer em tempo real.",
                        tech: ["Unity 3D", "C#", "XR Interaction Toolkit"]
                    },
                    {
                        title: "Suite de Apps Corporativas Híbridas",
                        category: "Mobile Development",
                        desc: "Ecossistema de aplicações focadas em performance e integração segura para ambientes empresariais. Design responsivo e alta fidelidade.",
                        tech: ["HTML5", "JavaScript", "Mobile Native Bindings"]
                    }
                    ]
                },
                goals: {
                    title: "Visão de Carreira",
                    items: [
                    "Desenvolvimento de Software para Multinacionais (Unitel, Sonangol, Tech Giants)",
                    "Liderança em Projetos de Inovação (VR, AI, Mobile)",
                    "Consultoria Premium e Freelancing Internacional",
                    "Referência em Engenharia de Software em África"
                    ]
                },
                certifications: {
                    title: "Certificações & Formação",
                    degree: "Engenharia Informática (4º Ano)",
                    uni: "Universidade Internacional do Cuanza",
                    items: [
                    "Competição de Programação ACPC / AOCPC",
                    "Certificação Java Developer Specialist (DIO)",
                    "Desenvolvimento de Estruturas de Dados Avançadas",
                    "Unity VR/AR Developer Certified Associate (Simulation)",
                    "Python for Data Science & Machine Learning Bootcamp",
                    "Cloud Infrastructure Fundamentals (AWS/Azure Path)"
                    ]
                },
                testimonials: {
                    title: "Reconhecimento Profissional",
                    items: [
                    { text: "João Carlos demonstra uma capacidade extraordinária de resolver problemas complexos com clareza e precisão técnica. Um ativo valioso.", author: "Director Técnico, Startup Tech" },
                    { text: "Profissional disciplinado, focado e com visão global. O seu código reflete maturidade e inteligência arquitetural.", author: "Senior Lead Developer" },
                    { text: "Tem grande potencial para liderar projetos de alto impacto no futuro. Combina inovação com entrega robusta.", author: "Gestor de Projetos, Consultoria Int." }
                    ]
                },
                contact: {
                    title: "Conexão Profissional",
                    cta: "Disponível para oportunidades globais.",
                    location: "Angola (Disponível para Remoto/Relocação)"
                }
                },
                en: {
                nav: { about: "About", skills: "Expertise", projects: "Projects", contact: "Contact" },
                hero: {
                    role: "Software Engineer & Full Stack Developer",
                    slogan: "Innovation, discipline, and code: the future starts here.",
                    cta: "View Projects",
                    contact: "Get in touch"
                },
                about: {
                    title: "Professional Profile",
                    text: "Computer Engineering student with a global strategic mindset. I am a disciplined, results-oriented programmer focused on creating innovative technological solutions for Angola and the international market. Combining academic rigor with practical application, I possess the technical maturity to transform complex challenges into efficient, scalable, and secure systems.",
                    philosophyTitle: "Work Philosophy",
                    philosophy: [
                    { title: "Excellence & Ethics", desc: "Delivery of clean, auditable, and high-standard code." },
                    { title: "Global Vision", desc: "Local solutions with architecture ready for the world." },
                    { title: "Discipline", desc: "Consistency in development and strict adherence to deadlines." },
                    { title: "Innovation", desc: "Using emerging tech (VR/XR/AI) to solve real problems." }
                    ]
                },
                skills: {
                    title: "Technical Arsenal",
                    languages: "Languages",
                    frameworks: "Frameworks & Tech",
                    core: "Core Competencies",
                    list: {
                    lang: ["Java", "C++", "Python", "JavaScript (ES6+)", "HTML5 / CSS3", "C#"],
                    tech: ["Unity VR / XR", "React & Native", "Cordova (Hybrid)", "RESTful APIs", "Git/GitHub", "SQL & NoSQL"],
                    soft: ["Advanced Algorithms", "Software Architecture", "Performance Optimization", "Data Security", "UI/UX Design"]
                    }
                },
                projects: {
                    title: "Executive Projects",
                    items: [
                    {
                        title: "International Cultural Exchange Platform",
                        category: "Full Stack & AI",
                        desc: "Global social app connecting youth from multiple countries. Features gamification, scholarships, and AI-driven moderation. Scalable architecture focused on international networking.",
                        tech: ["Java", "React", "AI Integration"]
                    },
                    {
                        title: "Tourism & Leasing System",
                        category: "Hybrid App & Security",
                        desc: "Complete solution for accommodation and tourism with integrated anti-fraud system. Premium admin panel, smart maps, and secure payment gateway.",
                        tech: ["Cordova", "Maps API", "Security Protocols"]
                    },
                    {
                        title: "VR/XR Immersive Simulations",
                        category: "Mixed Reality",
                        desc: "Immersive experiences for corporate training and education. Focus on physical realism, optimized assets, and real-time multiplayer support.",
                        tech: ["Unity 3D", "C#", "XR Interaction Toolkit"]
                    },
                    {
                        title: "Hybrid Corporate App Suite",
                        category: "Mobile Development",
                        desc: "Ecosystem of applications focused on performance and secure integration for business environments. Responsive design and high fidelity.",
                        tech: ["HTML5", "JavaScript", "Mobile Native Bindings"]
                    }
                    ]
                },
                goals: {
                    title: "Career Vision",
                    items: [
                    "Software Development for Multinationals (Unitel, Sonangol, Tech Giants)",
                    "Leading Innovation Projects (VR, AI, Mobile)",
                    "Premium Consulting & International Freelancing",
                    "Becoming a Software Engineering Reference in Africa"
                    ]
                },
                certifications: {
                    title: "Certifications & Education",
                    degree: "Computer Engineering (4th Year)",
                    uni: "International University of Cuanza",
                    items: [
                    "ACPC / AOCPC Programming Competition",
                    "Java Developer Specialist Certification (DIO)",
                    "Advanced Data Structures Development",
                    "Unity VR/AR Developer Certified Associate (Simulation)",
                    "Python for Data Science & Machine Learning Bootcamp",
                    "Cloud Infrastructure Fundamentals (AWS/Azure Path)"
                    ]
                },
                testimonials: {
                    title: "Professional Endorsements",
                    items: [
                    { text: "João Carlos demonstrates an extraordinary ability to solve complex problems with clarity and technical precision. A valuable asset.", author: "Tech Director, Tech Startup" },
                    { text: "Disciplined professional, focused with a global vision. His code reflects maturity and architectural intelligence.", author: "Senior Lead Developer" },
                    { text: "He has great potential to lead high-impact projects in the future. Combines innovation with robust delivery.", author: "Project Manager, Int. Consultancy" }
                    ]
                },
                contact: {
                    title: "Professional Connection",
                    cta: "Available for global opportunities.",
                    location: "Angola (Available for Remote/Relocation)"
                }
                }
            };

            const t = content[lang];

            return (
                <div className="min-h-screen bg-gray-50 text-gray-900 font-sans selection:bg-[#0A3D91] selection:text-white">
                
                {/* Navigation Bar */}
                <nav className="fixed w-full z-50 bg-white/90 backdrop-blur-md border-b border-gray-200 shadow-sm transition-all duration-300">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                    <div className="flex justify-between items-center h-20">
                        <div className="flex items-center">
                        <span className="font-montserrat font-bold text-2xl tracking-tighter text-[#0A3D91]">
                            JC<span className="text-black">.TECH</span>
                        </span>
                        </div>
                        
                        <div className="hidden md:flex items-center space-x-8">
                        <a href="#about" className="font-poppins text-sm font-medium text-gray-600 hover:text-[#0A3D91] transition-colors uppercase tracking-wide">{t.nav.about}</a>
                        <a href="#skills" className="font-poppins text-sm font-medium text-gray-600 hover:text-[#0A3D91] transition-colors uppercase tracking-wide">{t.nav.skills}</a>
                        <a href="#projects" className="font-poppins text-sm font-medium text-gray-600 hover:text-[#0A3D91] transition-colors uppercase tracking-wide">{t.nav.projects}</a>
                        <a href="#contact" className="px-5 py-2 bg-black text-white text-sm font-semibold rounded-none hover:bg-[#0A3D91] transition-all duration-300 shadow-lg">{t.nav.contact}</a>
                        </div>

                        <div className="flex items-center space-x-4">
                        {/* Language Switcher */}
                        <button 
                            onClick={() => setLang(lang === 'pt' ? 'en' : 'pt')}
                            className="no-print flex items-center space-x-2 bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded-full transition-colors"
                        >
                            <Icon name="globe" size={16} className="text-[#0A3D91]" />
                            <span className="font-montserrat text-xs font-bold uppercase">{lang}</span>
                        </button>
                        {/* Print Button */}
                        <button onClick={() => window.print()} className="no-print md:flex hidden items-center justify-center p-2 text-gray-500 hover:text-black">
                            <Icon name="download" size={20} />
                        </button>
                        </div>
                    </div>
                    </div>
                </nav>

                {/* Hero Section */}
                <header className="relative pt-32 pb-20 lg:pt-48 lg:pb-32 overflow-hidden bg-black text-white">
                    {/* Abstract Background Elements */}
                    <div className="absolute top-0 right-0 w-1/2 h-full bg-[#0A3D91] opacity-20 transform skew-x-12 translate-x-20"></div>
                    <div className="absolute bottom-0 left-0 w-1/3 h-1/2 bg-gray-800 opacity-20 rounded-full blur-3xl"></div>

                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
                    <div className="flex flex-col lg:flex-row items-center gap-12">
                        <div className={`flex-1 transition-all duration-1000 transform ${isVisible ? 'translate-y-0 opacity-100' : 'translate-y-10 opacity-0'}`}>
                        <div className="inline-block px-3 py-1 mb-6 border border-[#0A3D91] text-[#0A3D91] bg-[#0A3D91]/10 rounded font-bold text-xs uppercase tracking-widest font-montserrat">
                            {t.hero.role}
                        </div>
                        <h1 className="font-montserrat font-extrabold text-5xl lg:text-7xl leading-tight mb-6">
                            João Carlos <br/>
                            <span className="text-transparent bg-clip-text bg-gradient-to-r from-[#0A3D91] to-blue-400">
                            Francisco
                            </span>
                        </h1>
                        <p className="font-poppins text-gray-300 text-lg lg:text-xl max-w-2xl mb-10 font-light border-l-4 border-[#0A3D91] pl-6">
                            "{t.hero.slogan}"
                        </p>
                        
                        <div className="flex flex-col sm:flex-row gap-4 no-print">
                            <a href="#projects" className="px-8 py-4 bg-[#0A3D91] hover:bg-blue-700 text-white font-bold text-sm uppercase tracking-wider transition-all shadow-lg hover:shadow-blue-900/50 text-center">
                            {t.hero.cta}
                            </a>
                            <a href="#contact" className="px-8 py-4 bg-transparent border border-white hover:bg-white hover:text-black text-white font-bold text-sm uppercase tracking-wider transition-all text-center">
                            {t.hero.contact}
                            </a>
                        </div>
                        </div>

                        {/* Photo Placeholder */}
                        <div className="w-64 h-64 lg:w-96 lg:h-96 relative flex-shrink-0">
                        <div className="absolute inset-0 border-2 border-[#0A3D91] transform translate-x-4 translate-y-4"></div>
                        <div className="absolute inset-0 bg-gray-800 flex items-center justify-center overflow-hidden grayscale hover:grayscale-0 transition-all duration-500">
                            {/* User Instruction Reminder */}
                            <div className="text-center p-4">
                            <Icon name="user-check" size={48} className="mx-auto text-gray-500 mb-2"/>
                            <span className="text-gray-400 text-xs uppercase font-bold tracking-wider">Professional Photo Here</span>
                            </div>
                        </div>
                        </div>
                    </div>
                    </div>
                </header>

                {/* About & Philosophy */}
                <section id="about" className="py-20 bg-white">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-12">
                        <div className="lg:col-span-5 page-break">
                        <h2 className="font-montserrat font-bold text-3xl lg:text-4xl text-black mb-8 relative inline-block">
                            {t.about.title}
                            <span className="absolute bottom-0 left-0 w-1/2 h-1 bg-[#0A3D91]"></span>
                        </h2>
                        <p className="font-poppins text-gray-600 leading-relaxed text-lg mb-6">
                            {t.about.text}
                        </p>
                        
                        <div className="bg-gray-50 p-6 border-l-4 border-black mt-8">
                            <h3 className="font-montserrat font-bold text-lg mb-4 flex items-center gap-2">
                            <Icon name="terminal" size={20} className="text-[#0A3D91]"/> 
                            {t.goals.title}
                            </h3>
                            <ul className="space-y-3">
                                {t.goals.items.map((goal, idx) => (
                                <li key={idx} className="flex items-start text-sm text-gray-700 font-poppins">
                                    <Icon name="chevron-right" size={16} className="text-[#0A3D91] mt-0.5 mr-2 flex-shrink-0"/>
                                    {goal}
                                </li>
                                ))}
                            </ul>
                        </div>
                        </div>

                        <div className="lg:col-span-7">
                        <h3 className="font-montserrat font-bold text-2xl mb-8 text-gray-800">{t.about.philosophyTitle}</h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            {t.about.philosophy.map((item, idx) => (
                            <div key={idx} className="p-6 border border-gray-100 shadow-sm hover:shadow-md hover:border-[#0A3D91] transition-all bg-white group page-break">
                                <div className="w-10 h-10 bg-gray-100 group-hover:bg-[#0A3D91] rounded-full flex items-center justify-center mb-4 transition-colors">
                                    <Icon name="zap" size={20} className="text-gray-600 group-hover:text-white" />
                                </div>
                                <h4 className="font-montserrat font-bold text-lg mb-2">{item.title}</h4>
                                <p className="font-poppins text-gray-500 text-sm">{item.desc}</p>
                            </div>
                            ))}
                        </div>
                        </div>
                    </div>
                    </div>
                </section>

                {/* Skills Section */}
                <section id="skills" className="py-20 bg-gray-900 text-white">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                    <div className="text-center mb-16">
                        <h2 className="font-montserrat font-bold text-3xl lg:text-4xl mb-4 text-white">
                        {t.skills.title}
                        </h2>
                        <div className="w-24 h-1 bg-[#0A3D91] mx-auto"></div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                        {/* Languages */}
                        <div className="bg-gray-800 p-8 rounded-none border-t-4 border-[#0A3D91] page-break">
                        <div className="flex items-center gap-3 mb-6">
                            <Icon name="code-2" className="text-[#0A3D91]" size={28} />
                            <h3 className="font-montserrat font-bold text-xl">{t.skills.languages}</h3>
                        </div>
                        <ul className="space-y-3">
                            {t.skills.list.lang.map((s, i) => (
                            <li key={i} className="flex items-center justify-between border-b border-gray-700 pb-2">
                                <span className="font-poppins text-gray-300">{s}</span>
                                <span className="w-2 h-2 bg-[#0A3D91] rounded-full"></span>
                            </li>
                            ))}
                        </ul>
                        </div>

                        {/* Frameworks */}
                        <div className="bg-gray-800 p-8 rounded-none border-t-4 border-white page-break">
                        <div className="flex items-center gap-3 mb-6">
                            <Icon name="layers" className="text-white" size={28} />
                            <h3 className="font-montserrat font-bold text-xl">{t.skills.frameworks}</h3>
                        </div>
                        <ul className="space-y-3">
                            {t.skills.list.tech.map((s, i) => (
                            <li key={i} className="flex items-center justify-between border-b border-gray-700 pb-2">
                                <span className="font-poppins text-gray-300">{s}</span>
                                <span className="w-2 h-2 bg-white rounded-full"></span>
                            </li>
                            ))}
                        </ul>
                        </div>

                        {/* Core */}
                        <div className="bg-gray-800 p-8 rounded-none border-t-4 border-[#0A3D91] page-break">
                        <div className="flex items-center gap-3 mb-6">
                            <Icon name="cpu" className="text-[#0A3D91]" size={28} />
                            <h3 className="font-montserrat font-bold text-xl">{t.skills.core}</h3>
                        </div>
                        <ul className="space-y-3">
                            {t.skills.list.soft.map((s, i) => (
                            <li key={i} className="flex items-center justify-between border-b border-gray-700 pb-2">
                                <span className="font-poppins text-gray-300">{s}</span>
                                <span className="w-2 h-2 bg-[#0A3D91] rounded-full"></span>
                            </li>
                            ))}
                        </ul>
                        </div>
                    </div>
                    </div>
                </section>

                {/* Projects */}
                <section id="projects" className="py-20 bg-gray-50">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                    <div className="flex justify-between items-end mb-12">
                        <div>
                        <h2 className="font-montserrat font-bold text-3xl lg:text-4xl text-black mb-2">
                            {t.projects.title}
                        </h2>
                        <div className="w-16 h-1 bg-[#0A3D91]"></div>
                        </div>
                        <div className="hidden md:block">
                        <Icon name="github" className="text-gray-400 hover:text-black transition-colors cursor-pointer" size={32} />
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                        {t.projects.items.map((project, idx) => (
                        <div key={idx} className="bg-white border border-gray-200 p-8 shadow-sm hover:shadow-xl transition-all duration-300 group page-break">
                            <div className="flex justify-between items-start mb-4">
                            <span className="text-xs font-bold font-montserrat tracking-widest text-[#0A3D91] uppercase border border-[#0A3D91] px-2 py-1">
                                {project.category}
                            </span>
                            <div className="opacity-0 group-hover:opacity-100 transition-opacity">
                                <Icon name="chevron-right" className="text-black" />
                            </div>
                            </div>
                            <h3 className="font-montserrat font-bold text-2xl mb-4 group-hover:text-[#0A3D91] transition-colors">
                            {project.title}
                            </h3>
                            <p className="font-poppins text-gray-600 mb-6 text-sm leading-relaxed">
                            {project.desc}
                            </p>
                            <div className="flex flex-wrap gap-2 mt-auto">
                            {project.tech.map((tag, tIdx) => (
                                <span key={tIdx} className="text-xs font-semibold bg-gray-100 text-gray-600 px-3 py-1 rounded-full">
                                {tag}
                                </span>
                            ))}
                            </div>
                        </div>
                        ))}
                    </div>
                    </div>
                </section>

                {/* Certifications */}
                <section className="py-20 bg-white border-t border-gray-100">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-12">
                        <div className="lg:col-span-1">
                        <h2 className="font-montserrat font-bold text-3xl mb-4">{t.certifications.title}</h2>
                        <div className="p-6 bg-gray-900 text-white mt-4">
                            <Icon name="briefcase" size={32} className="text-[#0A3D91] mb-4"/>

                            <Icon name="linkedin" size={24} />

                        <p className="text-gray-500 text-xs font-mono">
